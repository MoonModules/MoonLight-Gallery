name: Test the gallery tool

on:
  push:
    paths: ["tools/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["tools/**", ".github/workflows/test.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tools/test_gallery.py
